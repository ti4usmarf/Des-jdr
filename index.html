<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanceur de dés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Karla:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#efe6d2;--surface:#e3d8bf;--ink:#1d2b27;--muted:#5d675f;--felt:#1f4d45;--on-felt:#f3ead6;
  --brass:#8a6a1c;--crit:#1d6b3a;--fumble:#8c2f39;--line:#c9bb98;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16352f;--surface:#1f4d45;--ink:#f3ead6;--muted:#a9bdb0;--felt:#0f2824;--on-felt:#f3ead6;
    --brass:#d8b45a;--crit:#7ddb9a;--fumble:#ff8f9b;--line:#2f6a5f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16352f;--surface:#1f4d45;--ink:#f3ead6;--muted:#a9bdb0;--felt:#0f2824;--on-felt:#f3ead6;
  --brass:#d8b45a;--crit:#7ddb9a;--fumble:#ff8f9b;--line:#2f6a5f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif;font-size:17px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.5rem;margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.result{background:var(--felt);color:var(--on-felt);border-radius:20px;padding:20px 16px;min-height:210px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px}
.formula{color:var(--brass);font-weight:700;min-height:1.4em}
.total{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:5.5rem;line-height:1}
.total.crit{color:var(--crit)}.total.fumble{color:var(--fumble)}
.total.rolling{animation:shake .45s ease}
@keyframes shake{0%{transform:rotate(-6deg) scale(.8)}40%{transform:rotate(5deg) scale(1.08)}100%{transform:none}}
.detail{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:72px}
.fly{display:block;width:60px;height:60px}
.fly svg{width:100%;height:100%;overflow:visible}
.fly polygon,.fly circle,.fly rect{fill:#efe6d2;stroke:#c9a24b;stroke-width:3;stroke-linejoin:round}
.fly.drop{opacity:.35}
.fly.hi polygon,.fly.hi circle,.fly.hi rect{fill:#9fe0b2}
.fly.lo polygon,.fly.lo circle,.fly.lo rect{fill:#f2a0a8}
.fly text{fill:#1d2b27;font:800 22px 'Bricolage Grotesque',system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.modchip{font-weight:800;font-size:1.4rem;color:var(--brass)}
.copy{margin-top:10px;height:48px;width:100%;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chip{background:rgba(243,234,214,.14);border-radius:8px;padding:2px 10px;font-weight:700}
.chip small{opacity:.7;font-weight:400;margin-right:4px}
.chip.drop{opacity:.45;text-decoration:line-through}
.chip.hi{background:var(--crit);color:#0b1f1a}.chip.lo{background:var(--fumble);color:#fff}
.note{min-height:1.4em;font-weight:700}

h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.05rem;margin:24px 0 10px}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.die{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;height:64px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.15rem}
.die.on{border-color:var(--brass);background:var(--felt);color:var(--on-felt)}
.die .n{position:absolute;top:-8px;right:-6px;background:var(--brass);color:#1d1a10;border-radius:999px;min-width:24px;height:24px;font-size:.85rem;line-height:24px;padding:0 6px}
.die .minus{position:absolute;bottom:2px;left:4px;width:32px;height:28px;border:0;background:none;font-size:1.2rem;color:inherit;opacity:.75}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mod{display:flex;align-items:center;gap:12px}
.mod button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700}
.mod output{min-width:3ch;text-align:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.5rem}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:12px 6px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--on-felt)}
.seg.off{opacity:.45;pointer-events:none}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}

.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:22px}
.actions button{height:60px;border-radius:14px;font-weight:800;font-size:1.15rem;border:2px solid var(--line);background:var(--surface)}
.actions .go{background:var(--brass);border-color:var(--brass);color:#1d1a10;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.3rem}
.history{list-style:none;margin:0;padding:0}
.history li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.history b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.2rem}
.history .f{color:var(--muted)}
.clear{margin-top:10px;background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px 0}
.lab{display:block;margin:12px 0 4px;font-weight:700}
.field{width:100%;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;min-height:44px}
.chk input{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.total.rolling{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Lanceur de dés</h1>

  <section class="result" aria-live="polite">
    <div class="formula" id="formula">1d20</div>
    <div class="total" id="total">–</div>
    <div class="detail" id="detail"></div>
    <div class="note" id="note"></div>
  </section>
  <button class="copy" id="copy" hidden>Copier pour Discord</button>

  <h2>Dés à lancer</h2>
  <div class="dice" id="dice"></div>
  <p class="hint">Touchez un dé pour en ajouter un, le − pour en retirer.</p>

  <h2>Modificateur</h2>
  <div class="mod">
    <button id="mm" aria-label="Retirer 1 au modificateur">−</button>
    <output id="mod">+0</output>
    <button id="mp" aria-label="Ajouter 1 au modificateur">+</button>
  </div>

  <h2>Avantage</h2>
  <div class="seg" id="adv" role="group" aria-label="Avantage ou désavantage">
    <button data-m="0" aria-pressed="true">Normal</button>
    <button data-m="1" aria-pressed="false">Avantage</button>
    <button data-m="-1" aria-pressed="false">Désavantage</button>
  </div>
  <p class="hint" id="advhint">Disponible quand vous lancez un seul d20.</p>

  <div class="actions">
    <button id="reset">Vider</button>
    <button class="go" id="roll">Lancer</button>
  </div>

  <h2>Discord</h2>
  <label class="lab" for="hook">URL du webhook</label>
  <input class="field" id="hook" type="url" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false">
  <label class="lab" for="pname">Nom du joueur</label>
  <input class="field" id="pname" type="text" maxlength="40" placeholder="Ex. Aragorn">
  <label class="chk"><input type="checkbox" id="auto" checked> Envoyer chaque lancer automatiquement</label>
  <p class="hint" id="dstatus">L’URL reste dans votre navigateur et n’est envoyée qu’à Discord.</p>

  <h2>Historique</h2>
  <ul class="history" id="history"></ul>
  <button class="clear" id="clear" hidden>Effacer l’historique</button>
</main>

<script>
(function(){
  var TYPES=[4,6,8,10,12,20,100];
  var pool={20:1}, mod=0, advMode=0, history=[], busy=false, lastMsg='';
  var $=function(id){return document.getElementById(id)};

  function rnd(n){
    var a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n;
    do{crypto.getRandomValues(a)}while(a[0]>=lim);
    return a[0]%n+1;
  }
  function count(){var c=0;for(var k in pool)c+=pool[k];return c}
  function isSingleD20(){return count()===1&&pool[20]===1}
  function formula(){
    var p=TYPES.filter(function(t){return pool[t]}).map(function(t){return pool[t]+'d'+t}).join('+');
    if(!p)p='–';
    var f=p;
    if(isSingleD20()&&advMode===1)f='d20 avantage';
    if(isSingleD20()&&advMode===-1)f='d20 désavantage';
    if(mod)f+=(mod>0?'+':'−')+Math.abs(mod);
    return f;
  }

  function drawDice(){
    $('dice').innerHTML='';
    TYPES.forEach(function(t){
      var b=document.createElement('button');
      b.className='die'+(pool[t]?' on':'');
      b.setAttribute('aria-label','Ajouter un d'+t);
      b.textContent='d'+t;
      if(pool[t]){
        var n=document.createElement('span');n.className='n';n.textContent=pool[t];b.appendChild(n);
        var m=document.createElement('span');m.className='minus';m.textContent='−';
        m.setAttribute('role','button');m.setAttribute('aria-label','Retirer un d'+t);
        m.onclick=function(e){e.stopPropagation();pool[t]--;if(!pool[t])delete pool[t];refresh()};
        b.appendChild(m);
      }
      b.onclick=function(){pool[t]=(pool[t]||0)+1;refresh()};
      $('dice').appendChild(b);
    });
  }
  function refresh(){
    drawDice();
    $('formula').textContent=formula();
    $('mod').textContent=(mod>=0?'+':'−')+Math.abs(mod);
    var ok=isSingleD20();
    $('adv').classList.toggle('off',!ok);
    if(!ok){advMode=0}
    Array.prototype.forEach.call($('adv').children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.m===advMode))});
  }

  function dieSvg(t,v){
    var s={4:'<polygon points="32,6 58,54 6,54"/>',6:'<rect x="8" y="8" width="48" height="48" rx="9"/>',8:'<polygon points="32,3 59,32 32,61 5,32"/>',10:'<polygon points="32,3 59,26 32,61 5,26"/>',12:'<polygon points="32,3 61,24 50,58 14,58 3,24"/>',20:'<polygon points="32,2 58,17 58,47 32,62 6,47 6,17"/>',100:'<circle cx="32" cy="32" r="28"/>'}[t];
    return '<svg viewBox="0 0 64 64" aria-hidden="true">'+s+'<text x="32" y="'+(t===4?42:33)+'">'+v+'</text></svg>';
  }
  function roll(){
    if(!count()){$('note').textContent='Ajoutez au moins un dé.';return}
    var chips=[],sum=0,note='',cls='';
    if(isSingleD20()&&advMode!==0){
      var a=rnd(20),b=rnd(20),keep=advMode===1?Math.max(a,b):Math.min(a,b);
      var aKept=a===keep;
      chips=[{v:a,drop:!aKept},{v:b,drop:aKept}];
      if(a===b)chips[1].drop=true,chips[0].drop=false;
      chips.forEach(function(c){c.hi=!c.drop&&advMode===1;c.lo=!c.drop&&advMode===-1});
      sum=keep;
      if(keep===20){note='Réussite critique !';cls='crit'}
      else if(keep===1){note='Échec critique…';cls='fumble'}
    }else{
      TYPES.forEach(function(t){
        for(var i=0;i<(pool[t]||0);i++){var v=rnd(t);chips.push({v:v,t:t});sum+=v}
      });
      if(isSingleD20()){
        if(sum===20){note='Réussite critique !';cls='crit'}
        else if(sum===1){note='Échec critique…';cls='fumble'}
      }
    }
    var f=formula(), total=sum+mod;
    var t=$('total');
    t.className='total';t.textContent='…';
    $('formula').textContent=f;
    $('note').textContent='';
    $('copy').hidden=true;
    var d=$('detail');d.innerHTML='';
    busy=true;
    var fast=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var last=0;
    chips.forEach(function(c,i){
      var type=c.t||20;
      var w=document.createElement('span');
      w.className='fly'+(c.drop?' drop':'')+(c.hi?' hi':'')+(c.lo?' lo':'');
      w.innerHTML=dieSvg(type,c.v);
      d.appendChild(w);
      if(fast)return;
      var txt=w.querySelector('text');
      var delay=Math.min(i,10)*60, dur=1000, x=Math.random()*160-80;
      last=Math.max(last,delay+dur);
      w.animate([
        {transform:'translate('+x+'px,-140px) rotate(-540deg) scale(.4)',opacity:0},
        {transform:'translate('+(x/4)+'px,0) rotate(30deg) scale(1.1)',opacity:1,offset:.5},
        {transform:'translateY(-30px) rotate(-12deg)',offset:.68},
        {transform:'translateY(0) rotate(6deg)',offset:.84},
        {transform:'none'}
      ],{duration:dur,delay:delay,easing:'ease-out',fill:'backwards'});
      txt.textContent=rnd(type);
      var iv=setInterval(function(){txt.textContent=rnd(type)},70);
      setTimeout(function(){clearInterval(iv);txt.textContent=c.v},delay+dur-150);
    });
    setTimeout(function(){
      if(mod){var m=document.createElement('span');m.className='modchip';m.textContent=(mod>0?'+':'−')+Math.abs(mod);d.appendChild(m)}
      t.className='total rolling '+cls;t.textContent=total;
      $('note').textContent=note;
      var vals=chips.map(function(c){return c.drop?'~~'+c.v+'~~':String(c.v)}).join(', ');
      lastMsg='🎲 **'+f+'** : **'+total+'**  ('+vals+(mod?' '+(mod>0?'+':'−')+Math.abs(mod):'')+')'+(note?' · '+note:'');
      $('copy').hidden=false;
      sendDiscord();
      history.unshift({f:f,total:total,note:note});
      history=history.slice(0,20);drawHistory();
      busy=false;
    },last);
  }
  function drawHistory(){
    var h=$('history');h.innerHTML='';
    history.forEach(function(e){
      var li=document.createElement('li');
      var l=document.createElement('span');l.className='f';l.textContent=e.f+(e.note?' · '+e.note:'');
      var r=document.createElement('b');r.textContent=e.total;
      li.appendChild(l);li.appendChild(r);h.appendChild(li);
    });
    $('clear').hidden=!history.length;
  }

  var LS={
    get:function(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  $('hook').value=LS.get('hook');
  $('pname').value=LS.get('pname');
  $('auto').checked=LS.get('auto')!=='0';
  $('hook').onchange=function(){LS.set('hook',$('hook').value.trim())};
  $('pname').onchange=function(){LS.set('pname',$('pname').value.trim())};
  $('auto').onchange=function(){LS.set('auto',$('auto').checked?'1':'0')};
  function validHook(u){return /^https:\/\/(?:ptb\.|canary\.)?discord(?:app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/.test(u)}
  function sendDiscord(){
    var url=$('hook').value.trim(), st=$('dstatus');
    LS.set('hook',url);LS.set('pname',$('pname').value.trim());
    if(!url||!$('auto').checked)return;
    if(!validHook(url)){st.textContent='URL de webhook invalide.';return}
    st.textContent='Envoi…';
    fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:$('pname').value.trim()||'Lanceur de dés',content:lastMsg,allowed_mentions:{parse:[]}})
    }).then(function(r){
      st.textContent=r.ok?'Envoyé sur Discord ✓':'Discord a refusé l’envoi ('+r.status+').';
    }).catch(function(){st.textContent='Envoi impossible (réseau ou URL ?).'});
  }
  function copyMsg(){
    var b=$('copy');
    function ok(){b.textContent='Copié ! Collez-le dans Discord';setTimeout(function(){b.textContent='Copier pour Discord'},2000)}
    function fallback(){var a=document.createElement('textarea');a.value=lastMsg;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){b.textContent='Copie impossible'}document.body.removeChild(a)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastMsg).then(ok,fallback)}else fallback();
  }
  $('roll').onclick=function(){if(!busy)roll()};
  $('copy').onclick=copyMsg;
  $('reset').onclick=function(){pool={};mod=0;advMode=0;refresh();$('total').textContent='–';$('detail').innerHTML='';$('note').textContent='';$('copy').hidden=true};
  $('mm').onclick=function(){mod--;refresh()};
  $('mp').onclick=function(){mod++;refresh()};
  $('clear').onclick=function(){history=[];drawHistory()};
  Array.prototype.forEach.call($('adv').children,function(b){b.onclick=function(){advMode=+b.dataset.m;refresh()}});
  refresh();drawHistory();
})();
</script>
</body>
</html>
